apiVersion: v1
kind: Service
metadata:
  name: rag-1997-service
  labels:
    app: rag-1997
spec:
  selector:
    app: rag-1997
  ports:
    - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rag-1997-lb
spec:
  selector:
    app: rag-1997
  ports:
    - port: 8000
    targetPort: 8000
  type: LoadBalancer
